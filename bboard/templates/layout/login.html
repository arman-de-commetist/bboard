{% extends "layout/base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="card p-4 shadow-lg border-0" style="width: 380px; border-radius: 16px;">
        <h3 class="text-center mb-4 fw-bold">Авторизация</h3>

        <form>
            <div class="mb-3">
                <label class="form-label fw-semibold">Email</label>
                <input type="email" class="form-control form-control-lg shadow-sm" style="border-radius: 10px;">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Пароль</label>
                <input type="password" class="form-control form-control-lg shadow-sm" style="border-radius: 10px;">
            </div>

            <button
                class="btn w-100 btn-lg text-white"
                style="
                    background: linear-gradient(135deg, #6a11cb, #2575fc);
                    border-radius: 12px;
                    transition: 0.3s;
                "
                onmouseover="this.style.opacity='0.8'"
                onmouseout="this.style.opacity='1'"
            >
                Войти
            </button>
        </form>

        <p class="mt-3 text-center text-muted" style="font-size: 14px;">
            Нет аккаунта? <a href="#" class="text-decoration-none">Создать</a>
        </p>
    </div>
</div>
{% endblock %}
